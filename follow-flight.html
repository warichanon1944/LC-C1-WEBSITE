<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flight Control Dashboard</title>

<style>
html, body {
  margin:0;
  height:100%;
  font-family:"Segoe UI", sans-serif;
  background:#0b1220;
  display:flex;
  justify-content:center;
  align-items:center;
}

.container{
  width:85vw;
  height:75vh;
  background:#111827;
  border-radius:14px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,0.08);
  display:flex;
  flex-direction:column;
}

.header{
  padding:14px;
  text-align:center;
  font-weight:700;
  color:#38bdf8;
  background:#0f172a;
  position:relative;
}

.back-btn{
  position:absolute;
  left:12px;
  top:50%;
  transform:translateY(-50%);
  color:#38bdf8;
  text-decoration:none;
  font-size:12px;
}

.frame{
  flex:1;
  position:relative;
}

iframe{
  width:100%;
  height:100%;
  border:none;
}

/* LIVE PANEL */
#flightBox{
  position:absolute;
  bottom:10px;
  left:10px;
  right:10px;
  height:140px;
  background:rgba(0,0,0,0.7);
  color:white;
  padding:10px;
  border-radius:10px;
  overflow:auto;
  font-size:13px;
  border:1px solid rgba(56,189,248,0.2);
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <a class="back-btn" href="LC-C1.html">← BACK</a>
    ✈ FLIGHT CONTROL DASHBOARD
  </div>

  <div class="frame">

    <iframe
      src="https://thaiairways365.sharepoint.com/sites/LC-LCDocuments/_layouts/15/Doc.aspx?sourcedoc={E61BBE66-4055-49DC-8FE4-62788EEA364C}&action=embedview&wdAllowInteractivity=True">
    </iframe>

   

  </div>

</div>

<script>
async function loadFlights(){
  const res = await fetch("data.json?cache=" + new Date().getTime());
  const data = await res.json();

  let html = "";

  data.flights.forEach(f => {

    let color = "#22c55e";
    if(f.status === "DELAYED") color = "#f59e0b";
    if(f.status === "CANCELLED") color = "#ef4444";

    html += `
      <div style="display:flex;justify-content:space-between;
      padding:4px 0;border-bottom:1px solid #1f2937">
        <span>${f.no}</span>
        <span style="color:${color}">${f.status}</span>
      </div>
    `;
  });

  document.getElementById("flightBox").innerHTML = html;
}

// real-time refresh
setInterval(loadFlights, 3000);
loadFlights();
</script>

</body>
</html>
