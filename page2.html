body{

.title{
  text-align:center;

  font-weight:900;

  background: linear-gradient(90deg,#4b0082,#6d28d9,#2563eb);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;

.file-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:25px;
  padding:50px;
  max-width:1000px;
  margin:auto;
}

.file-card{
  background:white;
  border-radius:18px;
  padding:25px;
  text-align:center;
  cursor:pointer;

  box-shadow:0 10px 25px rgba(0,0,0,0.1);
  transition:0.25s;
}

.file-card:hover{
  transform:translateY(-8px) scale(1.03);
  box-shadow:0 15px 35px rgba(75,0,130,0.2);
}

.icon{
  font-size:50px;
}

.name{

  color:#4b0082;
}

.back{

.back button{
  background: linear-gradient(135deg,#4b0082,#6d28d9);
  color:white;
  border:none;
  padding:12px 20px;
  border-radius:10px;
  cursor:pointer;
  font-weight:700;
}

/* ================= LOADER ================= */
#loader{
  position:fixed;
  inset:0;
  z-index:999999;

  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;

  background: linear-gradient(135deg,#eef2ff,#f8fafc);

  opacity:0;
  visibility:hidden;
  transition:0.3s ease;
}

#loader.show{
  opacity:1;
  visibility:visible;
}

.loader-spinner{
  width:60px;
  height:60px;
  border-radius:50%;
  border:4px solid rgba(75,0,130,0.15);
  border-top:4px solid #6d28d9;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  to{ transform:rotate(360deg); }
}

.loader-text{
  margin-top:15px;
  font-weight:800;
  color:#4b0082;
  letter-spacing:2px;
}

<script>
function goBack(){

  const loader = document.getElementById("loader");

}
</script>
</style>
