<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>CHANGE PASSWORD</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:'Inter',sans-serif;
  background: radial-gradient(circle at top,#eef2ff,#dbeafe,#f8fafc);
  overflow:hidden;
}

/* glow */
.glow{
  position:absolute;
  width:600px;
  height:600px;
  background:radial-gradient(circle,#22c55e 0%,transparent 70%);
  filter:blur(100px);
  opacity:0.25;
}

/* card */
.card{
  position:relative;
  width:360px;
  padding:30px;
  border-radius:18px;
  background:rgba(255,255,255,0.78);
  backdrop-filter:blur(15px);
  box-shadow:0 20px 60px rgba(0,0,0,0.15);
  border:1px solid rgba(255,255,255,0.4);
  animation: float 4s ease-in-out infinite;
}

/* title */
h3{
  margin:0 0 20px;
  text-align:center;
  font-size:20px;
  font-weight:700;
  color:#16a34a;
  letter-spacing:1px;
}

/* input */
input{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  border:1px solid #e2e8f0;
  outline:none;
  font-size:14px;
  transition:0.2s;
}

input:focus{
  border-color:#22c55e;
  box-shadow:0 0 0 3px #22c55e30;
}

/* button */
button{
  width:100%;
  padding:12px;
  margin-top:15px;
  border:none;
  border-radius:10px;
  background:linear-gradient(135deg,#22c55e,#16a34a);
  color:white;
  font-weight:600;
  cursor:pointer;
  transition:0.2s;
  box-shadow:0 10px 20px rgba(34,197,94,0.25);
}

button:hover{
  transform:translateY(-2px);
  box-shadow:0 15px 25px rgba(34,197,94,0.35);
}

/* error */
#error{
  color:#ef4444;
  font-size:12px;
  margin-top:10px;
  text-align:center;
}

/* animation */
@keyframes float{
  0%{transform:translateY(0px)}
  50%{transform:translateY(-6px)}
  100%{transform:translateY(0px)}
}

.back-btn{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background:#64748b;
  color:white;
  font-weight:600;
  cursor:pointer;
  transition:0.2s;
}

.back-btn:hover{
  background:#475569;
  transform:translateY(-2px);
}
</style>
</head>

<body>

<div class="glow"></div>

<div class="card">
  <h3>🔐 CHANGE PASSWORD</h3>

  <input id="u" placeholder="USER ID">
  <input id="oldp" type="password" placeholder="OLD PASSWORD">
  <input id="newp" type="password" placeholder="NEW PASSWORD">

  <button onclick="changePass()">CHANGE PASSWORD</button>

<button class="back-btn" onclick="goBack()">
  🔙 BACK TO LOGIN
</button>

  <div id="error"></div>
</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbzlkp1w6pmQxH1_C91LpjtuyAtGXKoHqq-36wuUoM-3x3u5iQh2yK1EhPz_kE2d45-Vjw/exec";

async function changePass(){

  const u = document.getElementById("u").value.trim().toUpperCase();
  const oldp = document.getElementById("oldp").value;
  const newp = document.getElementById("newp").value;

  if(!u || !oldp || !newp){
    return showError("กรอกข้อมูลให้ครบ");
  }

  try{

    const res = await fetch(API_URL,{
      method:"POST",
      body: JSON.stringify({
        action:"changePassword",
        username:u,
        oldPassword:oldp,
        newPassword:newp
      })
    });

    const data = await res.json();

if(data.status === "success"){
  alert("✅ เปลี่ยนรหัสสำเร็จ");

  setTimeout(()=>{
    window.location.href = "login.html";
  }, 1000);
}else{
      showError("❌ รหัสเดิมไม่ถูกต้อง");
    }

  }catch(e){
    console.log(e);
    showError("SERVER ERROR");
  }
}

function showError(msg){
  document.getElementById("error").innerText = msg;
}

function goBack(){
  window.location.href = "login.html";
}

</script>

</body>
</html>
