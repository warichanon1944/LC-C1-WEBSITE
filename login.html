<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>SPIDER LOGIN</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:'Inter',sans-serif;
  background: radial-gradient(circle at top,#eef2ff,#dbeafe,#f8fafc);
  overflow:hidden;
}

/* glow background */
.glow{
  position:absolute;
  width:600px;
  height:600px;
  background:radial-gradient(circle,#6366f1 0%,transparent 70%);
  filter:blur(90px);
  opacity:0.3;
}

/* card */
.card{
  position:relative;
  width:340px;
  padding:30px;
  border-radius:18px;
  background:rgba(255,255,255,0.75);
  backdrop-filter:blur(15px);
  box-shadow:0 20px 60px rgba(0,0,0,0.15);
  border:1px solid rgba(255,255,255,0.4);
  animation: float 4s ease-in-out infinite;
}

/* title */
h3{
  margin:0 0 20px;
  text-align:center;
  font-size:20px;
  font-weight:700;
  color:#4f46e5;
  letter-spacing:1px;
}

/* inputs */
input{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  border:1px solid #e2e8f0;
  outline:none;
  transition:0.2s;
  font-size:14px;
}

input:focus{
  border-color:#6366f1;
  box-shadow:0 0 0 3px #6366f130;
}

/* login button */
button{
  width:100%;
  padding:12px;
  margin-top:15px;
  border:none;
  border-radius:10px;
  background:linear-gradient(135deg,#6366f1,#4f46e5);
  color:white;
  font-weight:600;
  cursor:pointer;
  transition:0.2s;
  box-shadow:0 10px 20px rgba(99,102,241,0.3);
}

button:hover{
  transform:translateY(-2px);
  box-shadow:0 15px 25px rgba(99,102,241,0.4);
}

/* change password button */
.small-btn{
  margin-top:10px;
  background:none;
  border:none;
  color:#4f46e5;
  font-size:12px;
  cursor:pointer;
  transition:0.2s;
}

.small-btn:hover{
  color:#1d4ed8;
  text-decoration:underline;
}

/* error */
#error{
  color:#ef4444;
  font-size:12px;
  margin-top:10px;
  text-align:center;
}

/* animation */
@keyframes float{
  0%{transform:translateY(0px)}
  50%{transform:translateY(-6px)}
  100%{transform:translateY(0px)}
}
</style>
</head>

<body>

<div class="glow"></div>

<div class="card">
  <h3>✈️ SPIDER LOGIN</h3>

  <input id="u" placeholder="USER ID">
  <input id="p" type="password" placeholder="PASSWORD">

  <button onclick="login()">LOGIN</button>

  <button class="small-btn" onclick="goChange()">
    🔐 เปลี่ยนรหัสผ่าน
  </button>
<button class="small-btn" onclick="goBack()">
  🔙 กลับไป HOME
</button>

  <div id="error"></div>
</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbzlkp1w6pmQxH1_C91LpjtuyAtGXKoHqq-36wuUoM-3x3u5iQh2yK1EhPz_kE2d45-Vjw/exec";

async function login(){

  const u = document.getElementById("u").value.trim().toUpperCase();
  const p = document.getElementById("p").value;

  if(!u || !p){
    return showError("กรอก USER / PASSWORD");
  }

  try{

    const res = await fetch(API_URL,{
      method:"POST",
      body: JSON.stringify({
        action:"login",
        username:u,
        password:p
      })
    });

    const data = await res.json();

    if(data.status === "success"){

      localStorage.setItem("auth","true");
      localStorage.setItem("user",u);
      localStorage.setItem("name",data.name || "");
      localStorage.setItem("loginTime",Date.now());

      window.location.href = "spider_report.html";

    }else{
      showError("USER / PASSWORD ไม่ถูกต้อง");
    }

  }catch(e){
    console.log(e);
    showError("SERVER ERROR");
  }
}

function goChange(){
  window.location.href = "change_password.html";
}

function showError(msg){
  document.getElementById("error").innerText = msg;
}

function goBack(){
  window.location.href = "LC-C1.html";
}

</script>

</body>
</html>
